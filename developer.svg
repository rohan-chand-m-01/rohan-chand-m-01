<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100">
  <defs>
    <clipPath id="clip1">
      <rect id="clip-rect1" x="0" y="-25" width="0" height="35" />
    </clipPath>
    <clipPath id="clip2">
      <rect id="clip-rect2" x="0" y="-25" width="0" height="35" />
    </clipPath>
    <clipPath id="clip3">
      <rect id="clip-rect3" x="0" y="-25" width="0" height="35" />
    </clipPath>
    <clipPath id="clip4">
      <rect id="clip-rect4" x="0" y="-25" width="0" height="35" />
    </clipPath>

    <filter id="redShadow">
      <feOffset dx="-1.5" dy="0" result="offset" />
      <feFlood flood-color="#ff2d75" result="color" />
      <feComposite operator="in" in="color" in2="offset" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="cyanShadow">
      <feOffset dx="1.5" dy="0" result="offset" />
      <feFlood flood-color="#ff69b4" result="color" />
      <feComposite operator="in" in="color" in2="offset" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes showGroup1 {
      0%, 24% { opacity: 1; visibility: visible; }
      25%, 100% { opacity: 0; visibility: hidden; }
    }
    @keyframes showGroup2 {
      0%, 24% { opacity: 0; visibility: hidden; }
      25%, 49% { opacity: 1; visibility: visible; }
      50%, 100% { opacity: 0; visibility: hidden; }
    }
    @keyframes showGroup3 {
      0%, 49% { opacity: 0; visibility: hidden; }
      50%, 74% { opacity: 1; visibility: visible; }
      75%, 100% { opacity: 0; visibility: hidden; }
    }
    @keyframes showGroup4 {
      0%, 74% { opacity: 0; visibility: hidden; }
      75%, 99% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; }
    }

    @keyframes type1 {
      0% { width: 0; }
      2% { width: 0; }
      7% { width: 230px; }
      20% { width: 230px; }
      22% { width: 0; }
      25%, 100% { width: 0; }
    }
    @keyframes moveCursor1 {
      0% { x: 0; }
      2% { x: 0; }
      7% { x: 230px; }
      20% { x: 230px; }
      22% { x: 0; }
      25%, 100% { x: 0; }
    }

    @keyframes type2 {
      0%, 25% { width: 0; }
      27% { width: 0; }
      32% { width: 225px; }
      45% { width: 225px; }
      47% { width: 0; }
      50%, 100% { width: 0; }
    }
    @keyframes moveCursor2 {
      0%, 25% { x: 0; }
      27% { x: 0; }
      32% { x: 225px; }
      45% { x: 225px; }
      47% { x: 0; }
      50%, 100% { x: 0; }
    }

    @keyframes type3 {
      0%, 50% { width: 0; }
      52% { width: 0; }
      58% { width: 205px; }
      70% { width: 205px; }
      72% { width: 0; }
      75%, 100% { width: 0; }
    }
    @keyframes moveCursor3 {
      0%, 50% { x: 0; }
      52% { x: 0; }
      58% { x: 205px; }
      70% { x: 205px; }
      72% { x: 0; }
      75%, 100% { x: 0; }
    }

    @keyframes type4 {
      0%, 75% { width: 0; }
      77% { width: 0; }
      82% { width: 290px; }
      95% { width: 290px; }
      97% { width: 0; }
      100% { width: 0; }
    }
    @keyframes moveCursor4 {
      0%, 75% { x: 0; }
      77% { x: 0; }
      82% { x: 290px; }
      95% { x: 290px; }
      97% { x: 0; }
      100% { x: 0; }
    }

    @keyframes glitchRed {
      0%, 100% { transform: translate(0, 0) skew(0deg); opacity: 0.9; }
      8% { transform: translate(-2px, 1px) skew(-2deg); opacity: 1; }
      9% { transform: translate(1px, -1px) skew(3deg); opacity: 1; }
      10% { transform: translate(0, 0) skew(0deg); }
      55% { transform: translate(0, 0); }
      56% { transform: translate(-3px, -1px) skew(5deg); }
      57% { transform: translate(2px, 2px) skew(-5deg); }
      58% { transform: translate(0, 0); }
      88% { transform: translate(0, 0); }
      89% { transform: translate(-1px, 2px) skew(2deg); }
      90% { transform: translate(0, 0); }
    }
    @keyframes glitchCyan {
      0%, 100% { transform: translate(0, 0) skew(0deg); opacity: 0.9; }
      8% { transform: translate(2px, -1px) skew(2deg); opacity: 1; }
      9% { transform: translate(-1px, 1px) skew(-3deg); opacity: 1; }
      10% { transform: translate(0, 0) skew(0deg); }
      55% { transform: translate(0, 0); }
      56% { transform: translate(3px, 1px) skew(-3deg); }
      57% { transform: translate(-2px, -2px) skew(3deg); }
      58% { transform: translate(0, 0); }
      88% { transform: translate(0, 0); }
      89% { transform: translate(1px, -2px) skew(-1deg); }
      90% { transform: translate(0, 0); }
    }

    .g1 { animation: showGroup1 20s infinite; }
    #clip-rect1 { animation: type1 20s infinite; }
    #cursor1 { animation: moveCursor1 20s infinite; }

    .g2 { animation: showGroup2 20s infinite; }
    #clip-rect2 { animation: type2 20s infinite; }
    #cursor2 { animation: moveCursor2 20s infinite; }

    .g3 { animation: showGroup3 20s infinite; }
    #clip-rect3 { animation: type3 20s infinite; }
    #cursor3 { animation: moveCursor3 20s infinite; }

    .g4 { animation: showGroup4 20s infinite; }
    #clip-rect4 { animation: type4 20s infinite; }
    #cursor4 { animation: moveCursor4 20s infinite; }

    .main-text {
      fill: #ffffff;
      font-family: 'Fira Code', 'JetBrains Mono', 'Segoe UI Mono', Consolas, monospace;
      font-size: 20px;
      font-weight: 600;
    }
    .glitch-r {
      fill: #ff2d75;
      font-family: 'Fira Code', 'JetBrains Mono', 'Segoe UI Mono', Consolas, monospace;
      font-size: 20px;
      font-weight: 600;
      animation: glitchRed 4s infinite steps(1);
      opacity: 0.85;
    }
    .glitch-c {
      fill: #ff69b4;
      font-family: 'Fira Code', 'JetBrains Mono', 'Segoe UI Mono', Consolas, monospace;
      font-size: 20px;
      font-weight: 600;
      animation: glitchCyan 4s infinite steps(1);
      opacity: 0.85;
    }

    .cursor {
      fill: #ff69b4;
      animation: blink 0.8s infinite;
    }
    .prompt {
      fill: #4f5b66;
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 600;
    }
  </style>

  <rect width="800" height="100" rx="10" fill="#0a1628" stroke="#1e3a5f" stroke-width="1.5" />

  <circle cx="25" cy="25" r="5" fill="#ff5f56" />
  <circle cx="40" cy="25" r="5" fill="#ffbd2e" />
  <circle cx="55" cy="25" r="5" fill="#27c93f" />

  <text x="25" y="65" class="prompt">
    <tspan fill="#1e90ff">rohan</tspan><tspan fill="#f8f8f2">@</tspan><tspan fill="#ff69b4">dev</tspan><tspan fill="#f8f8f2">:~$ </tspan>
  </text>

  <g class="g1" transform="translate(204, 65)">
    <g clip-path="url(#clip1)">
      <text x="0" y="0" class="glitch-r">Web 2 Developer</text>
      <text x="0" y="0" class="glitch-c">Web 2 Developer</text>
      <text x="0" y="0" class="main-text">Web 2 Developer</text>
    </g>
    <rect id="cursor1" x="0" y="-20" width="3" height="24" class="cursor" />
  </g>

  <g class="g2" transform="translate(204, 65)">
    <g clip-path="url(#clip2)">
      <text x="0" y="0" class="glitch-r">AIML Practitioner</text>
      <text x="0" y="0" class="glitch-c">AIML Practitioner</text>
      <text x="0" y="0" class="main-text">AIML Practitioner</text>
    </g>
    <rect id="cursor2" x="0" y="-20" width="3" height="24" class="cursor" />
  </g>

  <g class="g3" transform="translate(204, 65)">
    <g clip-path="url(#clip3)">
      <text x="0" y="0" class="glitch-r">AIML Researcher</text>
      <text x="0" y="0" class="glitch-c">AIML Researcher</text>
      <text x="0" y="0" class="main-text">AIML Researcher</text>
    </g>
    <rect id="cursor3" x="0" y="-20" width="3" height="24" class="cursor" />
  </g>

  <g class="g4" transform="translate(204, 65)">
    <g clip-path="url(#clip4)">
      <text x="0" y="0" class="glitch-r">Open Source Contributor</text>
      <text x="0" y="0" class="glitch-c">Open Source Contributor</text>
      <text x="0" y="0" class="main-text">Open Source Contributor</text>
    </g>
    <rect id="cursor4" x="0" y="-20" width="3" height="24" class="cursor" />
  </g>
</svg>
